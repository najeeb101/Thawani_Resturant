<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | Thawani Restaurant &amp; Cafe</title>
  <meta name="description" content="Explore the full menu at Thawani Restaurant &amp; Cafe — Middle Eastern &amp; Moroccan mezze, tagines, grills, desserts, and coffee in Doha, Qatar.">
  <meta name="theme-color" content="#0A0A0A">

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <nav>
    <div class="container nav-container">
      <div class="nav-left">
        <a href="index.html" class="nav-logo">
          <img src="assets/images/logo.png" alt="Thawani Restaurant &amp; Cafe">
          <span class="nav-logo-text" data-i18n="brand-main">THAWANI<span> CAFE</span></span>
        </a>
      </div>
      <div class="nav-right">
        <div class="nav-links">
          <a href="index.html#home" data-i18n="nav-home">Home</a>
          <a href="menu.html" class="active" data-i18n="nav-menu">Menu</a>
          <a href="index.html#about" data-i18n="nav-about">About</a>
          <a href="index.html#contact" data-i18n="nav-contact">Contact</a>
        </div>
        <div class="nav-controls">
          <button class="lang-switch" id="langSwitch" aria-label="Switch language" data-i18n="lang-switch-label">العربية</button>
          <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobileMenu">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </div>

    <div class="mobile-menu-overlay" id="mobileMenu">
      <div class="nav-links">
        <a href="index.html#home" data-i18n="nav-home">Home</a>
        <a href="menu.html" data-i18n="nav-menu">Menu</a>
        <a href="index.html#about" data-i18n="nav-about">About</a>
        <a href="index.html#contact" data-i18n="nav-contact">Contact</a>
      </div>
    </div>
  </nav>

  <main>
    <section class="menu-section">
      <div class="container">
        <div class="menu-header reveal">
          <span class="section-tag" data-i18n="menu-tag">Our Menu</span>
          <h1 class="section-title" data-i18n="menu-title">Our Full Menu</h1>
          <div class="section-line"></div>
        </div>

        <div class="menu-tabs-wrap">
          <div class="menu-tabs" id="menuTabs"></div>
        </div>

        <div class="menu-grid" id="menuGrid"></div>
      </div>
    </section>
  </main>

  <footer>
    &copy; <span id="year"></span> <span data-i18n="footer-brand">Thawani</span> <span data-i18n="footer-text">Restaurant &amp; Cafe. All rights reserved.</span>
  </footer>

  <script src="js/translation-data.js" defer></script>
  <script src="js/menu-data.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/menu.js" defer></script>
</body>
</html>
